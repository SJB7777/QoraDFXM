name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (engine + CLI + GUI)
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # Qt needs an X server even head-less; the offscreen platform still wants
      # the usual xkb/EGL libraries present on a bare runner.
      - name: Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Test
        run: uv run pytest
