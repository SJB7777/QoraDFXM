[project]
name = "dfxm"
version = "0.1.0"
description = "DFXM detector-image analysis engine with a CLI and a PySide6 GUI"
readme = "README.md"
requires-python = ">=3.14"
# Headless base: the Core engine + the CLI. No Qt here on purpose — a batch /
# beamline machine installs only this. The desktop app is the `gui` extra.
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pandas>=2.2.0",
    "tifffile>=2026.6.1",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.11.0",   # pyqtgraph colormap source
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
]
cuda = ["cupy-cuda13x[ctk]>=14.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfxm"]

[project.scripts]
dfxm = "dfxm.cli:main"
dfxm-gui = "dfxm.gui.__main__:main"

[dependency-groups]
dev = [
    "dfxm[gui]",        # local dev works on the full app; headless installs skip it
    "ipykernel>=7.3.0",
    "nuitka>=4.1.3",
    "pytest>=8.4.0",
    "ruff>=0.16.0",
    "taskipy>=1.14.1",
]

[tool.ruff.lint]
# Explicit so CI matches any developer machine, whatever their global config.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "S", "DTZ"]
ignore = [
    "DTZ005",  # per-file operation logs are local wall-clock on purpose
    "PLR2004", # magic numbers are fine in layout/geometry code
    "PLC0415", # local imports are deliberate: Qt stays out of the CLI's import path
    "PLR0911", # long dispatch chains in the GUI read fine
    "PLR0913",
    "PLR0915", # widget builders are long by nature
    "RUF001",  # Korean UI text and µ/× are not "ambiguous" here
    "RUF002",
    "RUF003",
    "E501",    # the formatter owns code width; long strings/comments stay put
    "SIM105",  # explicit try/except/pass reads better than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
# The GUI must never die on a bad file, a missing icon, or a Qt quirk: broad
# excepts there are the policy, not an oversight.
"src/dfxm/gui/*" = ["BLE001", "S110"]
"src/dfxm/gui/models.py" = ["BLE001", "B008"]  # B008: QModelIndex() default is Qt's own signature
# Launching the OS file manager / the interpreter under test is the point.
"src/dfxm/gui/main_window.py" = ["BLE001", "S110", "S603", "S607"]
"tests/*" = ["S101", "S603", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# GUI tests drive the real MainWindow on Qt's offscreen platform; conftest sets
# QT_QPA_PLATFORM before Qt is imported.

[tool.taskipy.tasks]
gui = "python -m dfxm.gui"
cli = "python -m dfxm.cli"
test = "pytest"
lint = "ruff check src && ruff format --check src"
