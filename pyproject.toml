[project.scripts]
dfxm-gui = "dfxm.gui.__main__:main"
opticalc = "dfxm.gui.__main__:main"
dfxm = "dfxm.cli:main"

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "ruff>=0.16.0",
    "taskipy>=1.14.1",
]

[project]
name = "dfxm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cupy-cuda13x[ctk]>=14.1.1",
    "h5py>=3.16.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "nuitka>=4.1.3",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pandas>=2.2.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    "scikit-image>=0.26.0",
    "tifffile>=2026.6.1",
]

[tool.taskipy.tasks]
dev = "python src/main.py"
build = "python build.py"
